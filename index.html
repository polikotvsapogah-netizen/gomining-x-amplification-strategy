<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoMining Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0f1117; color: #e1e4ea; padding: 24px; min-height: 100vh; }

  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #2a2d38; }
  .header h1 { font-size: 22px; font-weight: 600; color: #fff; letter-spacing: 0.5px; }
  .header .meta { font-size: 12px; color: #4b5563; }

  /* --- KPI SECTIONS --- */
  .kpi-section { margin-bottom: 24px; }
  .kpi-section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #6b7280;
    margin-bottom: 10px; padding-left: 4px; display: flex; align-items: center; gap: 8px;
  }
  .kpi-section-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: #10b981; }
  .dot-yellow { background: #f59e0b; }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 840px; }
  .kpi {
    background: #1a1d27; border-radius: 8px; padding: 14px 16px;
    border: 1px solid #2a2d38;
  }
  .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #6b7280; margin-bottom: 4px; }
  .kpi-val { font-size: 24px; font-weight: 700; color: #fff; }
  .kpi-sub { font-size: 10px; color: #4b5563; margin-top: 2px; }
  .kpi-accent { border-top: 2px solid; }
  .kpi-accent.blue { border-color: #3b82f6; }
  .kpi-accent.green { border-color: #10b981; }
  .kpi-accent.yellow { border-color: #f59e0b; }
  .kpi-accent.purple { border-color: #8b5cf6; }

  /* --- CHARTS --- */
  .charts-row { margin-bottom: 24px; }
  .chart-card {
    background: #1a1d27; border-radius: 10px; border: 1px solid #2a2d38; padding: 18px 20px;
    min-width: 0;
  }
  .chart-card h2 { font-size: 14px; font-weight: 600; color: #e1e4ea; margin-bottom: 14px; }
  .chart-card .chart-wrap { position: relative; height: 340px; min-width: 0; }

  .wk-btn {
    background: #1a1d27; border: 1px solid #2a2d38; color: #6b7280; padding: 4px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .wk-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .wk-btn:hover:not(.active) { border-color: #4b5563; color: #d1d5db; }

  @media (max-width: 1100px) {
    .chart-card .chart-wrap { height: 320px; }
  }
  @media (max-width: 700px) {
    body { padding: 14px; }
    .header { align-items: flex-start; flex-direction: column; gap: 8px; }
    .header > div { align-items: flex-start !important; flex-direction: column; }
    .header .meta { line-height: 1.5; }
    .kpi-grid { grid-template-columns: 1fr; max-width: none; }
    .kpi-val { font-size: 20px; }
    .chart-card { padding: 16px 12px; }
    .chart-card .chart-wrap { height: 360px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>GOMINING DASHBOARD</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <div id="weekToggle" style="display:flex;gap:4px" hidden>
      <button class="wk-btn" data-weeks="4">4W</button>
      <button class="wk-btn active" data-weeks="12">12W</button>
    </div>
    <div class="meta"><span id="updatedAt">loading...</span></div>
  </div>
</div>

<!-- KPI: GENERAL -->
<div class="kpi-section">
  <div class="kpi-section-title"><span class="dot dot-yellow"></span> GENERAL</div>
  <div class="kpi-grid">
    <div class="kpi kpi-accent yellow">
      <div class="kpi-label">Clicks</div>
      <div class="kpi-val" id="campaignClicks">—</div>
      <div class="kpi-sub" id="campaignClicksSub">General Clicks per day</div>
    </div>
  </div>
</div>

<!-- KPI: POSTS -->
<div class="kpi-section">
  <div class="kpi-section-title"><span class="dot dot-green"></span> POSTS</div>
  <div class="kpi-grid">
    <div class="kpi kpi-accent blue"><div class="kpi-label">Views</div><div class="kpi-val" id="pViews">—</div></div>
    <div class="kpi kpi-accent green"><div class="kpi-label">Engagement</div><div class="kpi-val" id="pEngage">—</div></div>
    <div class="kpi kpi-accent purple"><div class="kpi-label">Total Links</div><div class="kpi-val" id="pTotal">—</div></div>
  </div>
</div>

<!-- POSTS CHART -->
<div class="charts-row">
  <div class="chart-card">
    <h2>Posts — 4 report weeks</h2>
    <div class="chart-wrap"><canvas id="chartWeeklyPosts"></canvas></div>
  </div>
</div>

<script>
const N = n => n != null ? n.toLocaleString('en-US') : '—';
const shortDate = d => { const p = d.split('-'); return `${parseInt(p[1])}/${parseInt(p[2])}`; };

function fillWeeks(weeks, n) {
  // Generate last n ISO weeks ending at the latest week in the dataset
  if (!weeks.length) return [];
  const lastW = parseInt(weeks[weeks.length - 1].slice(1));
  const result = [];
  for (let i = n - 1; i >= 0; i--) {
    const w = lastW - i;
    if (w > 0) result.push('W' + String(w).padStart(2, '0'));
  }
  return result;
}

function isoWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  const dayOfYear = Math.floor((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000) + 1;
  const weekDay = (d.getUTCDay() + 6) % 7;
  const weekNum = Math.ceil((dayOfYear - weekDay + 3) / 7);
  return `W${String(weekNum).padStart(2, '0')}`;
}

function buildChart(canvasId, labels, datasets) {
  const compact = window.matchMedia('(max-width: 700px)').matches;
  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { color: '#6b7280', font: { size: 10 }, boxWidth: 10, padding: 12 } },
        tooltip: {
          backgroundColor: '#1a1d27', borderColor: '#2a2d38', borderWidth: 1,
          titleColor: '#e1e4ea', bodyColor: '#d1d5db',
          callbacks: { label: ctx => `${ctx.dataset.label}: ${N(ctx.raw)}` }
        }
      },
      scales: {
        x: { ticks: { color: '#4b5563', font: { size: 10 }, maxRotation: 0 }, grid: { color: '#1f222d' } },
        yLeft: {
          type: 'linear', position: 'left',
          ticks: { color: '#3b82f6', font: { size: 10 }, callback: v => v >= 1000 ? (v/1000)+'K' : v },
          grid: { color: '#1f222d' },
          title: { display: true, text: 'Views', color: '#3b82f6', font: { size: 10 } }
        },
        yRight: {
          type: 'linear', position: 'right',
          ticks: { color: '#10b981', font: { size: 10 }, callback: v => v >= 1000 ? (v/1000)+'K' : v },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'Engagement', color: '#10b981', font: { size: 10 } }
        },
        yClicks: {
          type: 'linear', position: 'right', offset: true,
          display: !compact,
          ticks: { color: '#f59e0b', font: { size: 10 }, callback: v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : v >= 1000 ? (v/1000)+'K' : v },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'General Clicks', color: '#f59e0b', font: { size: 10 } }
        },
        yLinks: {
          type: 'linear', position: 'right', offset: true,
          display: !compact,
          ticks: { color: '#8b5cf6', font: { size: 10 }, callback: v => v >= 1000 ? (v/1000)+'K' : v },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'Links / Bans', color: '#8b5cf6', font: { size: 10 } }
        }
      }
    }
  });
}

function makeSeries(label, data, color, axis, type) {
  const s = { label, data, yAxisID: axis, borderColor: color.border, borderWidth: 2,
    tension: 0.35, pointRadius: 3, pointBackgroundColor: color.border };
  if (type === 'area') { s.fill = true; s.backgroundColor = color.bg; }
  if (type === 'bar') { s.type = 'bar'; s.backgroundColor = color.bg; s.borderWidth = 1; s.borderRadius = 2; s.barPercentage = 0.4; }
  return s;
}

let _dashData = null;
let _chartInstances = {};
let _activeWeeks = 4;

const tc = {
  views:  { bg: 'rgba(59,130,246,0.12)', border: '#3b82f6' },
  engage: { bg: 'rgba(16,185,129,0.12)', border: '#10b981' },
  clicks: { bg: 'rgba(245,158,11,0.12)', border: '#f59e0b' },
  links:  { bg: 'rgba(139,92,246,0.30)', border: '#8b5cf6' },
  bans:   { bg: 'rgba(239,68,68,0.30)',  border: '#ef4444' },
};

function parseDateUTC(dateStr) {
  return new Date(dateStr + 'T00:00:00Z');
}

function addDaysUTC(date, days) {
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + days);
  return d;
}

function dateKey(date) {
  return date.toISOString().slice(0, 10);
}

function bucketLabel(start, end) {
  return `${shortDate(dateKey(start))}–${shortDate(dateKey(end))}`;
}

function makeReportWeeks(count = 4) {
  const rp = _dashData.report_period || {};
  const custom = Array.isArray(rp.weeks) ? rp.weeks.filter(w => w && w.start && w.end) : [];
  if (custom.length && (count === custom.length || count === 4)) {
    return custom.map(w => ({
      label: w.label || bucketLabel(parseDateUTC(w.start), parseDateUTC(w.end)),
      start: w.start,
      end: w.end,
    }));
  }
  if (!rp.start || !rp.end) {
    const rawWeeks = [...new Set((_dashData.posts || []).map(d => isoWeek(d.date)))].sort();
    const fallback = fillWeeks(rawWeeks, count);
    return fallback.map(label => ({ label, start: null, end: null }));
  }

  const start = parseDateUTC(rp.start);
  const end = parseDateUTC(rp.end);
  const totalDays = Math.floor((end - start) / 86400000) + 1;
  const base = Math.floor(totalDays / count);
  const extra = totalDays - base * count;
  const weeks = [];
  let cursor = start;
  for (let i = 0; i < count; i++) {
    const size = base + (i === count - 1 ? extra : 0);
    const bucketStart = new Date(cursor);
    const bucketEnd = i === count - 1 ? end : addDaysUTC(cursor, size - 1);
    weeks.push({
      label: bucketLabel(bucketStart, bucketEnd),
      start: dateKey(bucketStart),
      end: dateKey(bucketEnd),
    });
    cursor = addDaysUTC(bucketEnd, 1);
  }
  return weeks;
}

function bucketForDate(dateStr, reportWeeks) {
  return reportWeeks.find(w => (!w.start || dateStr >= w.start) && (!w.end || dateStr <= w.end));
}

function aggregateReportWeeks(daily, reportWeeks) {
  const weeks = Object.fromEntries(reportWeeks.map(w => [w.label, {
    week: w.label, views: 0, engagement: 0, clicks: 0, bans: 0, total_urls: 0
  }]));
  for (const d of daily) {
    const bucket = bucketForDate(d.date, reportWeeks);
    if (!bucket) continue;
    const b = weeks[bucket.label];
    b.views += d.views || 0;  b.engagement += d.engagement || 0;
    b.clicks += d.clicks || 0;  b.bans += d.bans || 0;  b.total_urls += d.total_urls || 0;
  }
  return reportWeeks.map(w => weeks[w.label]);
}

function aggregateGeneralClicks(reportWeeks) {
  const weeks = Object.fromEntries(reportWeeks.map(w => [w.label, { week: w.label, clicks: 0 }]));
  const rows = _dashData.report_period?.daily_clicks || [];
  for (const d of rows) {
    const bucket = bucketForDate(d.date, reportWeeks);
    if (!bucket) continue;
    weeks[bucket.label].clicks += d.clicks || 0;
  }
  return reportWeeks.map(w => weeks[w.label]);
}

function renderCharts(weekCount) {
  // Destroy old charts
  for (const id of Object.keys(_chartInstances)) {
    _chartInstances[id].destroy();
    delete _chartInstances[id];
  }

  const P = _dashData.posts || [];

  const reportWeeks = makeReportWeeks(weekCount);
  const allWeeks = reportWeeks.map(w => w.label);
  const pWeekly = aggregateReportWeeks(P, reportWeeks);
  const generalClicksWeekly = aggregateGeneralClicks(reportWeeks);

  // Posts chart
  const pFull = pWeekly;
  _chartInstances['chartWeeklyPosts'] = buildChart('chartWeeklyPosts', allWeeks, [
    makeSeries('Views',      pFull.map(w=>w.views),      tc.views,  'yLeft',  'area'),
    makeSeries('Engagement', pFull.map(w=>w.engagement), tc.engage, 'yRight', 'line'),
    makeSeries('General Clicks', generalClicksWeekly.map(w=>w.clicks), tc.clicks, 'yClicks', 'line'),
    makeSeries('Links',      pFull.map(w=>w.total_urls), tc.links,  'yLinks', 'bar'),
  ]);

  document.querySelector('#chartWeeklyPosts').closest('.chart-card').querySelector('h2').textContent =
    `Posts — 4 report weeks`;
}

async function init() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    _dashData = await r.json();
  } catch(e) { document.getElementById('updatedAt').textContent = 'error loading data'; return; }

  document.getElementById('updatedAt').textContent = 'updated: ' + _dashData.updated + (_dashData.report_period ? ` · report ${_dashData.report_period.start} → ${_dashData.report_period.end}` : '');

  const P = _dashData.posts || [];
  const sum = (arr, k) => arr.reduce((s, d) => s + (d[k]||0), 0);
  const reportClicks = _dashData.report_period?.clicks || 0;

  document.getElementById('campaignClicks').textContent = N(reportClicks);
  document.getElementById('campaignClicksSub').textContent = _dashData.report_period
    ? `General Clicks per day, ${_dashData.report_period.start} → ${_dashData.report_period.end}`
    : 'General Clicks per day';

  document.getElementById('pViews').textContent = N(sum(P,'views'));
  document.getElementById('pEngage').textContent = N(sum(P,'engagement'));
  document.getElementById('pTotal').textContent = N(sum(P,'total_urls'));

  renderCharts(_activeWeeks);

  // Week toggle buttons
  document.querySelectorAll('.wk-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.wk-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      _activeWeeks = parseInt(btn.dataset.weeks);
      renderCharts(_activeWeeks);
    });
  });
}

init();
</script>
</body>
</html>
